[project]
name = "4-ever-game"
version = "0.1.0"
description = "Rokkini — classifica Elo per partite di pallavolo informali"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.42",
    "streamlit-authenticator>=0.4.2",
    "libsql>=0.1",
    "polars>=1.9",
    "altair>=5.4",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rokkini"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
